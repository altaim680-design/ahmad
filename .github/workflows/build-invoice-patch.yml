name: Build invoice collector patch
on:
  push:
    paths:
      - '.github/workflows/build-invoice-patch.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source file
        shell: python
        run: |
          from pathlib import Path
          import base64, zlib
          root = Path('.')
          d = root/'invoice_patch_exact'
          parts = [d/'p1.txt', d/'p2.txt', d/'p3.txt'] + [d/f'p4_{i}.txt' for i in range(1,7)] + [d/'p5.txt']
          payload = ''.join(p.read_text().strip() for p in parts)
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          (root/'web_invoice_collector_patch.py').write_text(source, encoding='utf-8')
      - name: Validate syntax
        run: python -m py_compile web_invoice_collector_patch.py
      - name: Commit generated source
        run: |
          git config user.name "nahda-bot"
          git config user.email "nahda-bot@users.noreply.github.com"
          git add web_invoice_collector_patch.py
          git diff --cached --quiet && exit 0
          git commit -m "Build invoice branding and collector role patch"
          git push
