name: Fix session open body
on:
  push:
    paths:
      - '.github/workflows/fix-session-open.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        shell: python
        run: |
          from pathlib import Path
          p = Path('nahda_server.py')
          s = p.read_text(encoding='utf-8')
          old = '            if parsed.path=="/api/session/open":\n                sid=secrets.token_urlsafe(24); s=Session()'
          new = '            if parsed.path=="/api/session/open":\n                self._read_json()\n                sid=secrets.token_urlsafe(24); s=Session()'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "nahda-bot"
          git config user.email "nahda-bot@users.noreply.github.com"
          git add nahda_server.py
          git commit -m "Fix session open request body handling"
          git push
